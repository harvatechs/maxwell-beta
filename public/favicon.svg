<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Soft Lavender Outer Left Wing Gradient -->
    <linearGradient id="leftWing" x1="15" y1="23" x2="45" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF7FF" />
      <stop offset="50%" stop-color="#E8DCFF" />
      <stop offset="100%" stop-color="#D4C2FF" />
    </linearGradient>

    <!-- Soft Lavender Outer Right Wing Gradient -->
    <linearGradient id="rightWing" x1="85" y1="23" x2="55" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5EEFF" />
      <stop offset="50%" stop-color="#DFCEFF" />
      <stop offset="100%" stop-color="#C9B4FF" />
    </linearGradient>

    <!-- Deep 3D Inner Left Fold Shadow Gradient -->
    <linearGradient id="innerLeft" x1="50" y1="44" x2="34" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9B7EFF" />
      <stop offset="60%" stop-color="#7A56F0" />
      <stop offset="100%" stop-color="#603ED8" />
    </linearGradient>

    <!-- Deep 3D Inner Right Fold Shadow Gradient -->
    <linearGradient id="innerRight" x1="50" y1="44" x2="66" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8868FF" />
      <stop offset="60%" stop-color="#6C4FE0" />
      <stop offset="100%" stop-color="#5232C7" />
    </linearGradient>

    <!-- 3D Drop Shadow for Mountain Fold -->
    <filter id="foldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4A2BB8" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#foldShadow)">
    <!-- Outer Left Wing -->
    <path d="M 15 23 L 50 44 L 34 76 Z" fill="url(#leftWing)" stroke="#C8B6FF" stroke-width="0.75" stroke-linejoin="round" />
    
    <!-- Outer Right Wing -->
    <path d="M 85 23 L 50 44 L 66 76 Z" fill="url(#rightWing)" stroke="#C4B0FF" stroke-width="0.75" stroke-linejoin="round" />

    <!-- Inner Left Mountain Fold -->
    <path d="M 50 44 L 34 76 L 50 59 Z" fill="url(#innerLeft)" stroke="#5B39D4" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Inner Right Mountain Fold -->
    <path d="M 50 44 L 66 76 L 50 59 Z" fill="url(#innerRight)" stroke="#4F2DC6" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Soft Center Crease Highlight -->
    <line x1="50" y1="44" x2="50" y2="59" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
